<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuentra tu Club - ServeMatch</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#0B2218', 
                        'brand-green': '#113525', 
                        'brand-yellow': '#D4F34A', 
                        'brand-gray': '#F3F4F6'
                    },
                    fontFamily: {
                        'sans': ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 antialiased bg-gray-50 flex flex-col min-h-screen">

    <!-- NAVBAR SIMPLIFICADO -->
    <header class="bg-brand-dark text-white py-4 px-6 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
                <i class="fa-solid fa-tennis-ball text-brand-yellow text-2xl"></i>
                <span class="font-bold text-xl tracking-wide">ServeMatch</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-gray-300 hover:text-brand-yellow transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Volver al inicio
            </a>
        </div>
    </header>

    <!-- CABECERA DE BÚSQUEDA -->
    <section class="bg-brand-green py-12 px-6 text-center text-white border-b-4 border-brand-yellow">
        <h1 class="text-3xl md:text-4xl font-bold mb-4">Selecciona tu Club</h1>
        <p class="text-gray-300 max-w-xl mx-auto text-sm">
            Haz clic en el recinto donde juegas para iniciar sesión, reservar canchas o inscribirte en los próximos torneos.
        </p>
    </section>

    <!-- VITRINA DE CLUBES (GRID) -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            <!-- TARJETA CLUB 1: DMK TENIS -->
            <!-- NOTA: Reemplaza href con el enlace real al subdominio -->
            <a href="https://servematch.javsof.cl/dmk" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300 group">
                <div class="h-32 bg-gray-100 flex items-center justify-center p-4 border-b border-gray-100">
                    <!-- Idealmente aquí pones el logo específico del club. Si no lo tienes aún, usa un icono -->
                    <i class="fa-solid fa-shield-halved text-5xl text-brand-green group-hover:scale-110 transition"></i>
                </div>
                <div class="p-5 text-center">
                    <h3 class="font-bold text-lg text-brand-dark mb-1">DMK Tenis</h3>
                    <p class="text-xs text-gray-500 mb-4"><i class="fa-solid fa-location-dot text-brand-yellow"></i> Coquimbo</p>
                    <span class="inline-block bg-brand-green text-white text-xs font-semibold px-4 py-2 rounded-md w-full group-hover:bg-brand-yellow group-hover:text-brand-dark transition">
                        Ingresar <i class="fa-solid fa-arrow-right ml-1"></i>
                    </span>
                </div>
            </a>

            <!-- TARJETA CLUB 2: EJEMPLO PÁDEL -->
            <a href="https://servematch.javsof.cl/clublaserena" class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300 group">
                <div class="h-32 bg-gray-100 flex items-center justify-center p-4 border-b border-gray-100">
                    <i class="fa-solid fa-table-tennis-paddle-ball text-5xl text-blue-800 group-hover:scale-110 transition"></i>
                </div>
                <div class="p-5 text-center">
                    <h3 class="font-bold text-lg text-brand-dark mb-1">Club La Serena</h3>
                    <p class="text-xs text-gray-500 mb-4"><i class="fa-solid fa-location-dot text-brand-yellow"></i> La Serena</p>
                    <span class="inline-block bg-brand-green text-white text-xs font-semibold px-4 py-2 rounded-md w-full group-hover:bg-brand-yellow group-hover:text-brand-dark transition">
                        Ingresar <i class="fa-solid fa-arrow-right ml-1"></i>
                    </span>
                </div>
            </a>

            <!-- ➕ ESPACIO PARA FUTUROS CLUBES (Plantilla) -->
            <!-- 
            <a href="https://servematch.javsof.cl/SLUG_DEL_CLUB" class="...">
               ...
            </a> 
            -->

        </div>
    </main>

    <!-- FOOTER SIMPLE -->
    <footer class="bg-white py-6 border-t border-gray-200 text-center">
        <p class="text-xs text-gray-400">© 2026 ServeMatch by Javsof. La plataforma de los clubes deportivos.</p>
    </footer>

</body>
</html>
